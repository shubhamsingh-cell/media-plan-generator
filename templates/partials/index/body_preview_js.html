<!-- ════════════════════════════════════════════════════════════════════
     NOVA PLAN STUDIO — live media-plan preview engine
     Reads the wizard fields and renders a brand-true plan that updates in
     real time (budget → channel mix → projected applies / hires / CPA).
     Self-contained; only reads the DOM, never mutates form fields.
     ════════════════════════════════════════════════════════════════════ -->
<script>
  (function () {
    "use strict";

    // True once the user toggles any channel in Step 3. The flag lives in
    // body_app_js.html (novaChannelsTouched) so the preview, /api/estimate
    // and /api/generate all read ONE state; the local copy is a fallback
    // for a page without that script.
    var channelsTouchedLocal = false;
    function channelsTouched() {
      return typeof novaChannelsTouched === "function"
        ? novaChannelsTouched()
        : channelsTouchedLocal;
    }
    function markChannelsTouched() {
      channelsTouchedLocal = true;
      if (typeof setNovaChannelsTouched === "function") setNovaChannelsTouched(true);
    }

    // ── Channel model (recruitment-marketing benchmarks) ──────────────
    // w = allocation weight · cpa = baseline cost per application (mid-skill)
    var CHANNELS = {
      chProgrammatic: { name: "Programmatic & DSP", color: "#6bb5ce", w: 1.35, cpa: 22 },
      chGlobalBoards: { name: "Global reach boards", color: "#5a54be", w: 1.25, cpa: 30 },
      chNicheBoards:  { name: "Niche & industry", color: "#b7669e", w: 0.9, cpa: 48 },
      chSocial:       { name: "Social media", color: "#8680d6", w: 1.0, cpa: 38 },
      chRegionalBoards: { name: "Regional & local", color: "#3e8fab", w: 0.85, cpa: 26 },
      chEmployerBrand: { name: "Employer branding", color: "#202058", w: 0.6, cpa: 85 },
      chApac:         { name: "APAC regional", color: "#45b6c8", w: 0.8, cpa: 16 },
      chEmea:         { name: "EMEA regional", color: "#3e8fab", w: 0.8, cpa: 24 },
    };
    // Order in which channels appear in the mix bar / legend
    var ORDER = ["chProgrammatic", "chGlobalBoards", "chNicheBoards", "chSocial",
      "chRegionalBoards", "chEmployerBrand", "chApac", "chEmea"];
    // /api/estimate channel key -> Step 3 toggle id (app.py
    // _estimate_funded_channels returns the keys the engine funded).
    var KEY_TO_ID = {
      programmatic_dsp: "chProgrammatic", global_boards: "chGlobalBoards",
      niche_boards: "chNicheBoards", social_media: "chSocial",
      regional_boards: "chRegionalBoards", employer_branding: "chEmployerBrand",
      apac_regional: "chApac", emea_regional: "chEmea",
    };
    // Channels the latest /api/estimate response actually funded:
    // [{id, key, share}] or null. The mix bar, legend and review step list
    // THESE, so preview = review = plan. There used to be a fixed 4-channel
    // STARTER mix here that no server surface ever funded (food_beverage
    // funds 6, incl. Regional and Employer Branding).
    var fundedChannels = null;
    var fundedSetSig = "";   // industry/locations/selection the list belongs to

    // Budget text, duration months and the per-period multiplier are read
    // by body_inputs_js.html (novaResolvePlanBudget / novaCampaignMonths /
    // novaBudgetMultiplier) -- the JS port of wizard_inputs.py, fed the
    // server's own embedded tables. The preview used to carry its own
    // parseMoney() ("1.5 million" -> 1.5M here, $1.50 on the server) and
    // its own duration map (wizard audit D-02, client report 2026-09-24).
    // tests/test_budget_period_preview_parity.py + test_wizard_budget_parser.py.
    // ── Small helpers ─────────────────────────────────────────────────
    function $(id) { return document.getElementById(id); }
    function val(id) { var el = $(id); return el ? (el.value || "").trim() : ""; }

    // The fields /api/generate will receive (body_app_js.html builds both
    // payloads from novaPlanCoreInputs); a bare-form fallback for a page
    // without that script.
    function planInputs() {
      if (typeof novaPlanCoreInputs === "function") return novaPlanCoreInputs();
      var br = val("budgetRange");
      return {
        budget_range: br === "__exact__" || !br ? val("exactBudget") : br,
        budget_period: val("budgetPeriod") || "campaign",
        campaign_duration: val("campaignDuration"),
        locations: readTags("locationsContainer"),
        target_roles: readTags("rolesContainer"),
      };
    }

    function readTags(containerId) {
      var c = $(containerId);
      if (!c) return [];
      var out = [];
      c.querySelectorAll(".tag").forEach(function (t) {
        var txt = (t.textContent || "").replace(/[×✕✖]/g, "").trim();
        if (txt) out.push(txt);
      });
      return out;
    }

    function checkedValues(name) {
      var out = [];
      document.querySelectorAll('input[name="' + name + '"]:checked').forEach(function (c) {
        out.push(c.value);
      });
      return out;
    }

    // ── Money formatters ──────────────────────────────────────────────
    function trim(x, d) { return Number(x.toFixed(d)).toString(); }
    // The plan's currency symbol as the SERVER resolves it (plan_currency via
    // /api/estimate's plan_currency); "$" only until it is known.
    function sym() {
      var c = (latestEstimate && latestEstimate.plan_currency) ||
        (typeof novaPlanCurrency === "function" ? novaPlanCurrency() : null);
      return c && c.symbol ? String(c.symbol) : "$";
    }
    function hero(v) {
      v = Math.max(0, v);
      if (v >= 1e6) return sym() + trim(v / 1e6, 2) + "M";
      if (v >= 1e3) return sym() + Math.round(v / 1e3) + "K";
      return sym() + Math.round(v);
    }
    function amtShort(v) {
      v = Math.max(0, v);
      if (v >= 1e6) return sym() + trim(v / 1e6, 1) + "M";
      if (v >= 1e3) return sym() + Math.round(v / 1e3) + "K";
      return sym() + Math.round(v);
    }
    function intc(v) { return Math.round(Math.max(0, v)).toLocaleString(); }
    // The cost per hire the hires figures DIVIDE the budget by, stated beside
    // them. It is Nova's own all-in industry table (not media-only, not a
    // published benchmark); /api/estimate sends it as hire_basis. "" when the
    // server sent none (no hires projected), so no basis is ever invented here.
    // A ranged hires figure runs from the midpoint (low end) to the plan-
    // efficiency floor (high end), and the note says so.
    function hireBasisText(est) {
      var hb = est && est.hire_basis;
      if (!hb || !(hb.midpoint_cph > 0)) return "";
      var k = function (v) { return sym() + (v >= 1000 ? trim(v / 1000, 2) + "K" : String(Math.round(v))); };
      var base = "an assumed " + k(hb.midpoint_cph) + " all-in cost per hire (Nova table)";
      var pr = est.projection && est.projection.hires;
      var ranged = !!(pr && pr.low != null && pr.high != null && pr.low !== pr.high);
      if (ranged && hb.floor_cph > 0) return "low end at " + base + ", high end at " + k(hb.floor_cph);
      return "at " + base;
    }
    // Applications are a directional model output: to the nearest 10 from 100
    // up ("2,020", not "2,016" -- whole units implied precision the estimate
    // does not have). Hires, a small count, stay exact.
    function appsFmt(v) {
      v = Math.max(0, v);
      return (v >= 100 ? Math.round(v / 10) * 10 : Math.round(v)).toLocaleString();
    }
    // The page itself calls these figures "directional", so whole currency
    // units ("$17", not "$17.36"): cents implied a precision the model does
    // not have. Below one unit the cents are the figure, so they stay.
    function cpaFmt(v) {
      if (!(v > 0)) return "—";
      return sym() + (v >= 1 ? String(Math.round(v)) : v.toFixed(2));
    }
    // How the hire goal is worded. A picked RANGE ("50-100 hires") is never
    // restated as a single number the user did not choose: it reads "50–100
    // hire goal (planned at ~75)" -- the plan is sized at the range's planning
    // value (see HV in gather) -- while an exact number the user typed stays
    // "75-hire target".
    function goalText(m) {
      if (m.goalRange) return m.goalRange + " hire goal (planned at ~" + intc(m.targetHires) + ")";
      return intc(m.targetHires) + "-hire target";
    }

    // ── Screenshot-safe count-up ──────────────────────────────────────
    var COUNTERS = new Set();
    function setNum(el, value, fmt) {
      if (!el) return;
      COUNTERS.add(el);
      el.__target = value;
      el.__fmt = fmt;
      var reduce = (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) || document.hidden;
      var start = (typeof el.__cur === "number") ? el.__cur : 0;
      if (reduce || start === value || !isFinite(value)) {
        el.__cur = value; el.textContent = fmt(value); return;
      }
      var t0 = performance.now(), dur = 600;
      cancelAnimationFrame(el.__raf);
      function tick(now) {
        var p = Math.min(1, (now - t0) / dur);
        var eased = 1 - Math.pow(1 - p, 3);
        var cur = start + (value - start) * eased;
        el.textContent = fmt(cur);
        if (p < 1) el.__raf = requestAnimationFrame(tick);
        else { el.__cur = value; el.textContent = fmt(value); }
      }
      el.__raf = requestAnimationFrame(tick);
      clearTimeout(el.__snap);
      el.__snap = setTimeout(function () {
        el.__cur = value; el.textContent = fmt(value); cancelAnimationFrame(el.__raf);
      }, dur + 250);
    }
    function finalize() {
      COUNTERS.forEach(function (el) {
        if (typeof el.__target === "number" && el.__fmt) {
          cancelAnimationFrame(el.__raf); el.__cur = el.__target; el.textContent = el.__fmt(el.__target);
        }
      });
      // Force-commit mix-bar widths with transition off (compositor may be
      // paused in a backgrounded tab, freezing the width transition at 0).
      var bar = $("npMixBar");
      if (bar) {
        bar.querySelectorAll(".np-mix-seg").forEach(function (seg) {
          var w = seg.style.width;
          seg.style.transition = "none";
          seg.style.width = w;
          void seg.offsetWidth;
          seg.style.transition = "";
        });
      }
    }

    // ── Gather model from the form ────────────────────────────────────
    function gather() {
      // budget — the SAME text, period and duration the generate payload
      // sends, read by the server's rules (range -> midpoint; per-period
      // amount x the campaign's months; bounds on the total). An amount the
      // server would reject previews as no budget, with its message.
      var inputs = planInputs();
      var plan = (typeof novaResolvePlanBudget === "function")
        ? novaResolvePlanBudget(inputs.budget_range, inputs.budget_period, inputs.campaign_duration)
        : null;
      var base = plan && plan.parse.ok ? plan.parse.amount : 0;
      var months = plan ? plan.months : 6;
      var period = (plan && plan.period) || "campaign";
      var total = plan && plan.ok ? plan.total : 0;
      var budgetError = plan && !plan.ok && inputs.budget_range ? plan.message : "";

      // channels — untouched toggles (the markup pre-checks only Social)
      // or a touched-then-all-unchecked set both mean Nova's recommended
      // industry mix, exactly as app._apply_channel_selection treats "every
      // channel off". The rows come from what /api/estimate funded.
      var selected = ORDER.filter(function (id) { var el = $(id); return el && el.checked; });
      var recommended = !channelsTouched() || selected.length === 0;

      // role class, used downstream (BENCH lookup, insight copy). Explicit
      // experience-level checkboxes win; otherwise infer from role text.
      // NOTE: this used to also derive a flat cpaMult/aph cost-per-hire
      // multiplier for the naive JS estimator removed alongside
      // /api/estimate (see fetchEstimate() below) -- those locals are gone,
      // only the role classification itself is still needed.
      var exp = checkedValues("experienceLevel").join(" ").toLowerCase();
      var roleStr = (readTags("rolesContainer").join(" ") + " " + val("roleInput") + " " + val("useCase")).toLowerCase();
      var roleClass = "skilled"; // mid-skill professional default
      if (exp.indexOf("executive") >= 0 || /\b(vp|chief|cxo|c-level|head of|director|executive|president)\b/.test(roleStr)) {
        roleClass = "executive";
      } else if (exp.indexOf("entry") >= 0 || /\b(warehouse|associate|driver|cashier|retail|crew|server|picker|packer|delivery|labor|cleaner|housekeep|caregiver|cna)\b/.test(roleStr)) {
        roleClass = "highVolume";
      } else if (exp.indexOf("senior") >= 0 || /\b(senior|lead|principal|staff)\b/.test(roleStr)) {
        roleClass = "senior";
      } else if (/\b(software|engineer|developer|devops|sre|architect|data scientist|machine learning|\bml\b|cyber|security engineer)\b/.test(roleStr)) {
        roleClass = "tech";
      }

      // target hire volume the user set (vs what the budget projects)
      var hvSel = val("hireVolume");
      var targetHires = 0;
      var goalRange = ""; // "50–100" when a range was picked, "" for an exact number
      if (hvSel === "__exact__") {
        targetHires = parseInt((val("exactHires") || "").replace(/[^0-9]/g, ""), 10) || 0;
      } else {
        var HV = { "1-10 hires": 6, "10-50 hires": 30, "50-100 hires": 75, "100-500 hires": 250, "500+ hires": 600 };
        targetHires = HV[hvSel] || 0;
        goalRange = targetHires ? hvSel.replace(/ hires$/, "").replace("-", "\u2013") : "";
      }
      var startMonth = parseInt(val("campaignStartMonth"), 10) || 0;

      // metro premium
      var locs = inputs.locations || readTags("locationsContainer");
      var locStr = locs.join(" ").toLowerCase();
      var metroMult = /(san francisco|bay area|new york|nyc|london|seattle|boston)/.test(locStr) ? 1.12 : 1.0;

      // allocation by weight -- spend split across the mix bar / legend.
      // NOTE: applications/hires/CPA are deliberately NOT derived here.
      // They used to come from a flat effective-CPA-per-channel formula
      // that diverged from the real budget engine by ~13x on real briefs
      // (617 naively-estimated hires vs. 48 actual engine-projected hires
      // on the Manpower-AmeriGas brief). Those numbers now come from
      // /api/estimate, which calls the SAME calculate_budget_allocation()
      // /api/generate uses -- see fetchEstimate() / paintOutcomes() below.
      var rows;
      if (fundedChannels) {
        // The engine's own split (same call /api/generate makes).
        rows = fundedChannels.map(function (f) {
          var c = CHANNELS[f.id];
          return { id: f.id, name: c.name, color: c.color, share: f.share, spend: total * f.share };
        });
      } else if (!recommended) {
        // Estimate pending for a new selection: the selected channels are
        // what the server will fund; shares are a placeholder weighting
        // until the engine's split arrives.
        var wsum = 0;
        selected.forEach(function (id) { wsum += CHANNELS[id].w; });
        rows = selected.map(function (id) {
          var c = CHANNELS[id];
          var share = wsum > 0 ? c.w / wsum : 0;
          return { id: id, name: c.name, color: c.color, share: share, spend: total * share };
        });
      } else {
        // Recommended mix not computed yet (needs a budget and a role):
        // show no channels rather than a mix the plan would not fund.
        rows = [];
      }

      // identity bits
      var client = val("clientName");
      var role = readTags("rolesContainer")[0] || "";
      if (!role) {
        var sel = document.querySelector(".industry-card.selected, .industry-card[aria-pressed='true']");
        if (sel) { var h = sel.querySelector("h3, .industry-name, strong"); role = h ? h.textContent.trim() : ""; }
      }
      if (!role) role = val("naicsSearch");

      return {
        total: total, base: base, rows: rows, recommended: recommended,
        client: client, role: role, locs: locs, period: period, months: months,
        roleClass: roleClass, targetHires: targetHires, goalRange: goalRange, startMonth: startMonth,
        metro: metroMult > 1, channelsTouched: channelsTouched(),
        plan: plan, budgetError: budgetError, inputs: inputs,
      };
    }

    // ── Live plan estimate (single-sourced via /api/estimate) ─────────
    // Root-cause fix: the "Projected outcomes" numbers used to come from
    // the flat effective-CPA formula above. This now calls the real
    // engine (same calculate_budget_allocation() /api/generate uses) so
    // the preview and the final generated plan can never disagree.
    var ESTIMATE_DEBOUNCE_MS = 500;
    var estimateTimer = null;
    var lastScheduledSig = "";   // signature of the last request scheduled/sent
    var latestEstimate = null;   // {est_hires, est_cph, est_applications, est_cpa} | null
    // The request signature (the JSON of the /api/estimate body) latestEstimate
    // was computed FOR. An estimate is only ever painted or worded against the
    // inputs it answered: the instant a budget/role/location is edited, the
    // estimate in hand is for different inputs even though fetchEstimate() has
    // not run yet (the budget field fires its own handlers before render()).
    var latestEstimateSig = "";
    // Finding D (2026-07-15 review): a failed/errored fetch used to leave
    // lastScheduledSig set to the failed sig forever, so fetchEstimate()'s
    // own dedupe guard (`sig === lastScheduledSig`) silently no-opped every
    // later render() tick -- including the 1600ms safety poll -- until the
    // user edited an input. estimateRetrySig/-Count track consecutive
    // failures for the CURRENT sig so a down/erroring server gets a bounded
    // number of automatic retries instead of either hammering forever or
    // going permanently silent.
    var ESTIMATE_MAX_AUTO_RETRIES = 3;
    var ESTIMATE_RETRY_DELAY_MS = 600; // before an automatic retry is re-scheduled
    var estimateRetrySig = "";   // sig currently being auto-retried
    var estimateRetryCount = 0;  // consecutive failures for estimateRetrySig

    function setFunded(data, setSig) {
      var list = (data && Array.isArray(data.channels)) ? data.channels : null;
      var rows = [];
      var sum = 0;
      (list || []).forEach(function (c) {
        var id = c && KEY_TO_ID[c.key];
        var amt = c ? Number(c.amount) : 0;
        if (id && CHANNELS[id] && amt > 0) { rows.push({ id: id, key: c.key, amt: amt }); sum += amt; }
      });
      fundedChannels = (rows.length && sum > 0) ? rows.map(function (r) {
        return { id: r.id, key: r.key, share: r.amt / sum };
      }) : null;
      fundedSetSig = fundedChannels ? setSig : "";
      notifyFunded();
    }
    // The funded channel SET depends on industry, locations (US-only strips
    // APAC/EMEA) and the selection; a budget/role edit only moves the
    // shares, so the list is kept until the new split arrives.
    function dropStaleFunded(locs, industry, channelCats, region) {
      var setSig = JSON.stringify([(locs || []).slice().sort(), industry, channelCats, region]);
      if (setSig !== fundedSetSig && fundedChannels) {
        fundedChannels = null;
        notifyFunded();
      }
      return setSig;
    }
    function notifyFunded() {
      if (typeof window.novaRenderReviewChannels === "function") {
        try { window.novaRenderReviewChannels(); } catch (e) { /* review step not mounted */ }
      }
    }

    // The /api/estimate body: EXACTLY the core fields the /api/generate
    // payload carries (novaPlanCoreInputs, body_app_js.html) -- the raw
    // budget text + period + duration (the server reads and scales them, as
    // it will at Generate), target_region, start month, the selected
    // industry key, roles, locations and the channel selection. It used to
    // post its own pre-multiplied budget, no region, no start month and the
    // typed NAICS search text as the industry (wizard audit D-02/D-04/D-23).
    function estimatePayload(m) {
      var base = m.inputs || planInputs();
      // Enterprise demand-first fields (site goals / hire volume, only while
      // the enterprise section is on and a goal exists): the answer then
      // carries goal_plan. Absent otherwise -> the body is exactly the core
      // fields /api/generate also carries.
      var extra = typeof novaEnterpriseGoalInputs === "function" ? novaEnterpriseGoalInputs() : {};
      return Object.keys(extra).length ? Object.assign({}, base, extra) : base;
    }
    // The resolved estimate IF it answers the inputs `m` describes, else null.
    // Every consumer (outcome cards, sticky bar, Nova insights, the Budget
    // Reality Check, the Nova chat context) goes through this, so a new budget
    // is never worded or shown against the previous budget's figures.
    function estimateFor(m) {
      if (!latestEstimate || !latestEstimateSig) return null;
      return latestEstimateSig === JSON.stringify(estimatePayload(m)) ? latestEstimate : null;
    }

    // "Updating estimate…" (the strip + the eyebrow's "Updating…") is the
    // state of the REAL /api/estimate request: on while one is scheduled or
    // in flight, off when it answers or fails.
    var estimating = false;
    function setEstimating(on) {
      estimating = !!on;
      var pane = $("planPreview");
      if (pane) pane.classList.toggle("recomputing", estimating);
      // The strip is invisible (opacity 0) while no request is in flight:
      // keep it out of the accessibility tree too, so assistive tech does not
      // read "Updating estimate" when nothing is updating.
      var strip = $("npAgentStrip");
      if (strip) strip.setAttribute("aria-hidden", estimating ? "false" : "true");
    }

    // Fetches a fresh /api/estimate only when the request body would change
    // -- the signature IS the payload, so it can never omit a field the
    // server reads (industry / client name / channel toggles each once went
    // missing from a hand-picked signature and left a stale estimate up).
    function fetchEstimate(m) {
      var payload = estimatePayload(m);
      var roles = payload.target_roles || [];
      var sig = JSON.stringify(payload);
      var setSig = dropStaleFunded(
        payload.locations, payload.industry, payload.channel_categories, payload.target_region
      );
      if (sig === lastScheduledSig) return;
      if (sig !== estimateRetrySig) {
        // A genuinely new input state, not just fetchEstimate() re-running
        // for the SAME failed sig after the catch handler below cleared
        // lastScheduledSig to retry it -- reset its retry budget.
        estimateRetrySig = sig;
        estimateRetryCount = 0;
      }
      lastScheduledSig = sig;
      clearTimeout(estimateTimer);

      if (!m.total || m.total <= 0 || !roles.length) {
        latestEstimate = null;
        latestEstimateSig = "";
        setEstimating(false);
        paintOutcomes(m);
        return;
      }

      // Never show a stale/naive number while a new estimate is pending --
      // clear to the neutral placeholder immediately, fill in once real.
      latestEstimate = null;
      latestEstimateSig = "";
      // A real request is now scheduled: "Updating estimate…" is true until
      // it answers or fails (cleared below), and not otherwise. Set BEFORE
      // painting so the pane and the sticky bar both paint the pending state.
      setEstimating(true);
      paintOutcomes(m);

      estimateTimer = setTimeout(function () {
        var requestSig = sig;
        fetch("/api/estimate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRF-Token": (typeof getCsrfToken === "function" ? getCsrfToken() : ""),
          },
          body: JSON.stringify(payload),
        }).then(function (res) {
          if (!res.ok) throw new Error("estimate failed: " + res.status);
          return res.json();
        }).then(function (data) {
          if (requestSig !== lastScheduledSig) return; // superseded by a newer request
          latestEstimate = (data && typeof data.est_hires === "number") ? data : null;
          latestEstimateSig = latestEstimate ? requestSig : "";
          setFunded(data, setSig);
          estimateRetryCount = 0; // a response (even a malformed one) ends the failure streak
          // Repaint from a FRESH gather(), not the `m` snapshot captured when
          // this fetch was scheduled -- targetHires/roleClass/channels can
          // have changed while the request was in flight (the sig guard
          // above only covers budget/roles/locations/industry/clientName),
          // and computeInsights()/NovaChat.projected must reflect the
          // wizard's CURRENT state, not a stale one.
          setEstimating(false);
          paintOutcomes(gather());
        }).catch(function () {
          if (requestSig !== lastScheduledSig) return;
          latestEstimate = null;
          latestEstimateSig = "";
          // Auto-retry: clearing lastScheduledSig makes this same sig look
          // "new" again to fetchEstimate()'s dedupe guard above, instead of
          // silently never refetching until an input changes. Capped so a
          // genuinely-down server isn't hammered forever once inputs stop
          // changing. While a retry is still coming the estimate is still
          // "updating": the bar and the cards say so and show NO dashes;
          // "unavailable" is only the verdict after the last retry fails.
          if (requestSig === estimateRetrySig && estimateRetryCount < ESTIMATE_MAX_AUTO_RETRIES) {
            estimateRetryCount++;
            lastScheduledSig = "";
            estimateTimer = setTimeout(function () { fetchEstimate(gather()); }, ESTIMATE_RETRY_DELAY_MS);
          } else {
            setEstimating(false);
          }
          paintOutcomes(gather());
        });
      }, ESTIMATE_DEBOUNCE_MS);
    }

    // ── Insight engine: turn the model into proactive advice ──────────
    // `est` is the latest /api/estimate response (or null while pending /
    // on failure) -- insights #1 and #2 make numeric hire/cost claims, so
    // they only render once `est` is a real, engine-derived number. Never
    // fall back to a locally-computed hire/CPH figure here.
    function channelOn(id) { var el = $(id); return !!(el && el.checked); }
    // When the estimate carries a goal_plan (enterprise section on + a goal),
    // the "Goal plan" line IS the answer to "does this budget meet the goal":
    // same goal, same numbers, one place. The hire-volume insight and the
    // Budget Reality Check below would word a DIFFERENT goal (the range
    // midpoint "planned at ~250", not the plan's 100 or the site goals' 301)
    // and a different gap, so they stand down (the test is inline in each:
    // `est && est.goal_plan && est.goal_plan.ok`).
    function computeInsights(m, est) {
      var ins = [];
      // a market with no local cost-per-hire benchmark projects no hires / CPH,
      // so no hires or cost-per-hire insight is worded either
      var noHires = !!(est && est.projection && est.projection.assumptions && est.projection.assumptions.hires_suppressed);
      var role = escapeHtml(m.role || ""); // user-controlled — escape before HTML
      // 1. feasibility vs the user's hire target (targetHires is collected
      // straight from the wizard's hireVolume/exactHires fields -- unchanged).
      // Honesty rule: "comfortably covers" (or any positive tone) is only
      // ever shown when the engine's est_hires actually meets the target.
      if (noHires || (est && est.goal_plan && est.goal_plan.ok)) {
        // nothing to say about hires here (or the Goal plan line says it)
      } else if (est && m.targetHires > 0 && est.est_hires < 1) {
        // below one hire there is no ratio or dollar gap to quote (and the
        // server sends no cost per hire): say what is true, in the Reality
        // Check's own words
        ins.push({ tone: "warn", text: "Budget supports <b>fewer than one hire</b> against your " + goalText(m) + " — raise the budget substantially or narrow scope." });
      } else if (est && m.targetHires > 0 && est.est_hires > 0) {
        var hr = est.projection && est.projection.hires;
        var hiresTxt = est.projection && est.projection.text ? est.projection.text.hires : "";
        var hiLo = hr && hr.low != null ? hr.low : est.est_hires;
        var hiHi = hr && hr.high != null ? hr.high : est.est_hires;
        var shown = hiresTxt || String(intc(est.est_hires));
        if (m.targetHires > hiHi) {
          // even the optimistic end falls short
          var gap = m.total * (m.targetHires / hiHi - 1);
          ins.push({ tone: "warn", text: "Budget supports an estimated <b>" + escapeHtml(shown) + " hires</b> against your " + goalText(m) + " — consider raising budget by ~<b>" + hero(gap) + "</b> or narrowing scope." });
        } else if (m.targetHires <= hiLo) {
          // No green reassurance: the count rests on an assumed all-in cost per
          // hire, so the sentence either names that figure or claims nothing.
          var hbIns = est.hire_basis && est.hire_basis.midpoint_cph > 0 ? est.hire_basis.midpoint_cph : 0;
          if (hbIns) {
            var hbK = sym() + (hbIns >= 1000 ? trim(hbIns / 1000, 2) + "K" : String(Math.round(hbIns)));
            ins.push({ tone: "info", text: "Budget covers your " + goalText(m) + " if hires cost the assumed <b>" + escapeHtml(hbK) + "</b> each (all-in, Nova table) — est. " + escapeHtml(shown) + " hires." });
          } else {
            ins.push({ tone: "info", text: "Your " + goalText(m) + " sits at or below the low end of the estimated <b>" + escapeHtml(shown) + " hires</b> — the estimate rests on an assumed cost per hire." });
          }
        } else {
          ins.push({ tone: "info", text: "Your " + goalText(m) + " sits inside the estimated range of <b>" + escapeHtml(shown) + " hires</b> — it depends on your real cost per hire." });
        }
      }
      // 2. cost per hire vs the SHRM-sourced quartiles /api/estimate returns
      // (est.cph_benchmark, from data/recruitment_benchmarks_2026_deep.json).
      // "High" / "Efficient" is only ever said against that yardstick: no
      // benchmark for these roles (or a non-USD plan) = no grade. The whole
      // estimated RANGE must clear the quartile to earn the word.
      var bm = est && est.cph_benchmark;
      if (est && !noHires && est.est_hires >= 1 && est.est_cph > 0 && bm && bm.p75 > 0 && bm.p25 > 0 && !(est.projection && est.projection.cph && est.projection.cph.low == null)) {
        var cr = est.projection && est.projection.cph;
        var cphLo = cr && cr.low != null ? cr.low : est.est_cph;
        var cphHi = cr && cr.high != null ? cr.high : est.est_cph;
        var cphTxt = est.projection && est.projection.text ? est.projection.text.cph : "";
        var yard = escapeHtml(bm.label) + " (sources listed in the benchmark file: " + escapeHtml(bm.source) + ")";
        // The benchmark is in US dollars (the server sends it for USD plans
        // only). One decimal under $10K so "$7.8K" is not rounded to "$8K".
        var usdK = function (v) { return "$" + (v < 10000 ? trim(v / 1000, 1) : Math.round(v / 1000)) + "K"; };
        var cphShown = cphTxt || ("~" + usdK(est.est_cph));
        if (cphLo > bm.p75) {
          ins.push({ tone: "warn", text: "High <b>" + escapeHtml(cphShown) + "/hire</b> for " + (role || "this role") + ": above the " + usdK(bm.p75) + " upper quartile for " + yard + ". Niche boards + employer brand usually pull it down." });
        } else if (cphHi < bm.p25) {
          ins.push({ tone: "good", text: "Efficient <b>" + escapeHtml(cphShown) + "/hire</b> for " + (role || "this role") + ": below the " + usdK(bm.p25) + " lower quartile for " + yard + "." });
        }
      }
      // 3. channel fit
      if (!m.recommended && m.rows.length === 1) {
        ins.push({ tone: "info", text: "Single channel — diversifying lowers risk and blended CPA." });
      } else if ((m.roleClass === "senior" || m.roleClass === "executive" || m.roleClass === "tech") && m.channelsTouched && !channelOn("chNicheBoards") && !channelOn("chEmployerBrand")) {
        ins.push({ tone: "info", text: "For " + (role || "senior roles") + ", add <b>Niche</b> or <b>Employer-brand</b> channels to reach passive talent." });
      }
      // 4. seasonality
      if (m.startMonth) {
        var q = Math.ceil(m.startMonth / 3);
        if (q === 1) ins.push({ tone: "info", text: "Q1 start = <b>peak hiring season</b> — expect higher CPCs; front-load budget." });
        else if (q === 4) ins.push({ tone: "info", text: "Q4 start — holiday slowdown; demand softens, costs ease late-quarter." });
      }
      return ins.slice(0, 3);
    }

    // The compact estimate bar (single-column layouts; CSS shows it only at
    // <=1080px): the same four figures as the full pane, from the same
    // resolved estimate. data-state="empty" (a one-line hint) until an
    // estimate exists, "ready" once it does.
    //   empty       the budget or the role is genuinely missing -> hint line
    //   loading     inputs set, an estimate for THESE inputs is not here yet
    //               (a keystroke not yet rendered, the debounce, a request in
    //               flight, or an automatic retry still to come) -> the CURRENT budget, "…" where the three
    //               figures go (dimmed) and "Updating estimate…". No earlier
    //               figure is ever shown: not under the new budget, and not
    //               under the old one either (a bar reading $35K over a field
    //               that says 60,000 is wrong whatever it is labelled).
    //   ready       the four figures
    //   unavailable inputs set, the last retry failed -> dashes, as the pane
    //               shows. Dashes are only ever this final verdict.
    // It used to fall back to the empty hint on every edit (fetchEstimate
    // clears latestEstimate), so the hint read "set a budget" for the whole
    // typing burst + debounce + round trip with a budget already set.
    function paintEstimateBar(m) {
      var bar = $("npEstimateBar");
      if (!bar) return;
      var haveInputs = m.total > 0 && ((m.inputs && m.inputs.target_roles) || []).length > 0;
      var est = haveInputs ? estimateFor(m) : null;
      var state, figs = null;
      if (!haveInputs) {
        state = "empty";
      } else if (est) {
        state = "ready";
        // the SAME low-high strings as the tiles (never the optimistic point);
        // "n/a" hires where the market has no local cost-per-hire benchmark
        var bt = est.projection && est.projection.text ? est.projection.text : null;
        figs = {
          nebBudget: hero(m.total),
          nebApps: bt ? bt.applications : appsFmt(est.est_applications),
          nebHires: bt ? bt.hires : intc(est.est_hires),
          nebCpa: bt ? bt.cpa : cpaFmt(est.est_cpa),
        };
      } else if (estimating || JSON.stringify(estimatePayload(m)) !== lastScheduledSig) {
        // a request is scheduled / in flight / being retried, OR the inputs
        // already differ from the last one scheduled (a keystroke whose
        // debounced render() has not run yet): either way the figures on
        // hand answer other inputs, so none is shown.
        state = "loading";
        figs = {
          nebBudget: hero(m.total),
          nebApps: "…",
          nebHires: "…",
          nebCpa: "…",
        };
      } else {
        state = "unavailable";
        figs = {
          nebBudget: hero(m.total),
          nebApps: "—",
          nebHires: "—",
          nebCpa: "—",
        };
      }
      bar.setAttribute("data-state", state);
      bar.setAttribute("aria-busy", state === "loading" ? "true" : "false");
      // what the hires range divides the budget by, on its own line under the
      // figures (ready state only; empty otherwise)
      var basisTxt = state === "ready" ? hireBasisText(est) : "";
      var basisEl = $("nebBasis");
      if (basisEl) {
        basisEl.textContent = basisTxt ? "Hires: " + basisTxt : "";
        if (basisTxt && est.hire_basis.label) basisEl.title = est.hire_basis.label;
      }
      if (figs) {
        Object.keys(figs).forEach(function (id) {
          var el = $(id);
          if (el) el.textContent = figs[id];
        });
      }
      var tail = " Show the full preview.";
      var label;
      if (state === "ready") {
        label = "Plan estimate: " + figs.nebBudget + " budget, " + figs.nebApps +
          " applications, " + figs.nebHires + " hires" + (basisTxt ? " (" + basisTxt + ")" : "") + ", " + figs.nebCpa + " per application." + tail;
      } else if (state === "loading") {
        label = "Plan estimate: updating." + tail;
      } else if (state === "unavailable") {
        label = "Plan estimate: unavailable right now." + tail;
      } else {
        label = "Plan estimate: set a budget and a role to see it." + tail;
      }
      bar.setAttribute("aria-label", label);
    }
    // Tap on the bar: bring the full preview into view (instant under
    // prefers-reduced-motion) and move focus there for keyboard users.
    function showPane() {
      var pane = $("planPreview");
      if (!pane) return;
      var behavior = typeof novaScrollBehavior === "function" ? novaScrollBehavior() : "auto";
      pane.scrollIntoView({ block: "start", behavior: behavior });
      pane.setAttribute("tabindex", "-1");
      try { pane.focus({ preventScroll: true }); } catch (e) { /* focus is a nicety */ }
    }

    // What the "Budget Reality Check" banner (checkBudgetFeasibility in
    // body_app_js.html) says, in the SAME words and figures as the first
    // "Nova insights" line (computeInsights above): the estimate engine's
    // hires and cost per hire against the hire goal. null until an estimate
    // computed for the CURRENT inputs exists (estimateFor), or while no goal /
    // budget is set -- so editing the budget never words the new budget
    // against the previous budget's hires.
    function feasibility() {
      var m = gather();
      var est = estimateFor(m);
      if (!est || !(m.total > 0) || !(m.targetHires > 0)) return null;
      // the Goal plan line already answers goal-vs-budget, in the plan's goal
      if (est.goal_plan && est.goal_plan.ok) return null;
      // no local cost-per-hire benchmark: no hires projected, so no verdict
      if (est.projection && est.projection.assumptions && est.projection.assumptions.hires_suppressed) return null;
      if (!(est.est_hires > 0)) {
        // fewer than one hire at this budget: the goal is out of reach, and
        // the banner says so (it used to vanish exactly here, because there
        // was no hires figure to put in the sentence)
        return { ratio: 0, belowOne: true, budget: hero(m.total), goal: goalText(m) };
      }
      // The banner quotes the SAME ranges as the tiles (never the optimistic
      // point): the verdict uses the upper end of the hires range, so
      // "underfunded" only fires when even the optimistic end falls short.
      var pj = est.projection || null;
      var hiHigh = pj && pj.hires && pj.hires.high > 0 ? pj.hires.high : est.est_hires;
      var txt = pj && pj.text ? pj.text : null;
      return {
        ratio: hiHigh / m.targetHires,
        budget: hero(m.total),
        hires: txt && txt.hires ? txt.hires : intc(est.est_hires),
        goal: goalText(m),
        cph: txt && txt.cph && txt.cph !== "n/a" ? txt.cph : hero(est.est_cph),
        ranged: !!(txt && txt.hires),
        gap: hero(m.total * (m.targetHires / hiHigh - 1)),
      };
    }

    // The inputs a plan was last generated from (JSON of the estimate
    // payload), or "" before any generation; see markGenerated.
    var generatedSig = "";
    function markGenerated() {
      generatedSig = JSON.stringify(planInputs());
      render();
    }
    // True when a plan was generated AND the wizard still holds the inputs it
    // was generated from (the same test the "Plan ready" badge uses). Ask Nova
    // only auto-sends a plan for which this holds.
    function planIsCurrent() {
      return !!generatedSig && JSON.stringify(estimatePayload(gather())) === generatedSig;
    }

    // Paints #npApplies/#npHires/#npCpa and #npInsights from whatever the
    // current resolved estimate state is (latestEstimate, module-level).
    // Never reads a local hire/CPA formula -- placeholder ("—") while
    // `latestEstimate` is null (pending fetch, failure, or no budget yet).
    function paintOutcomes(m) {
      var hasBudget = m.total > 0;
      var est = hasBudget ? estimateFor(m) : null;
      var proj = (est && est.projection) || null;
      if (proj && proj.text) {
        // Ranges, never a lone point: the strings come from the server's one
        // projection (plan_projection.describe), so the wizard, the review
        // step, Quick Plan, chat, the workbook and the deck print the same
        // low-high. The engine's own point figure is the optimistic end.
        [["npApplies", proj.text.applications], ["npHires", proj.text.hires], ["npCpa", proj.text.cpa]].forEach(function (pair) {
          var el = $(pair[0]); if (el) { el.textContent = pair[1] || "—"; el.__cur = 0; }
        });
      } else if (est) {
        setNum($("npApplies"), est.est_applications, appsFmt);
        setNum($("npHires"), est.est_hires, intc);
        setNum($("npCpa"), est.est_cpa, cpaFmt);
      } else {
        ["npApplies", "npHires", "npCpa"].forEach(function (id) {
          var el = $(id); if (el) { el.textContent = "—"; el.__cur = 0; }
        });
      }
      paintEstimateBar(m);
      // What the hires / cost-per-hire figures assume, stated beside them.
      var basis = $("npBasis");
      if (basis) {
        if (proj && proj.text && proj.assumptions && proj.assumptions.hires_suppressed) {
          // no local cost-per-hire benchmark: say so once, project no hires / CPH
          var sb = [escapeHtml(proj.text.hires_note)];
          if (proj.text.cpa_note) sb.push(escapeHtml(proj.text.cpa_note));
          basis.innerHTML = sb.join(" ");
          basis.style.display = "";
        } else if (proj && proj.text) {
          var bits = ["Est. cost / hire <b>" + escapeHtml(proj.text.cph) + "</b> (" + escapeHtml(proj.text.cph_short || "total cost-per-hire basis") + ")."];
          bits.push(escapeHtml(proj.text.hires_short || "Hires are an estimate from industry cost per hire; no client hire history provided."));
          var hbPane = hireBasisText(est);
          if (hbPane) bits.push("Hire range: " + escapeHtml(hbPane) + "; the table has no external source.");
          if (proj.text.cpa_note) bits.push(escapeHtml(proj.text.cpa_note));
          basis.innerHTML = bits.join(" ");
          basis.style.display = "";
        } else {
          basis.style.display = "none";
          basis.innerHTML = "";
        }
      }
      // Demand-first goal plan: ONE line from the same estimate response --
      // what the goal needs against what this budget covers.
      var goalEl = $("npGoalPlan");
      if (goalEl) {
        var gp = est && est.goal_plan;
        if (gp && gp.text && gp.text.callout) {
          goalEl.innerHTML = "<b>Goal plan:</b> " + escapeHtml(String(gp.text.callout));
          goalEl.style.display = "";
        } else {
          goalEl.style.display = "none";
          goalEl.innerHTML = "";
        }
      }
      // the Budget Reality Check banner words these same estimate figures
      if (typeof checkBudgetFeasibility === "function") {
        try { checkBudgetFeasibility(); } catch (e) { /* banner is advisory */ }
      }

      // Nova insights — proactive advice from the model
      var box = $("npInsights");
      if (box) {
        var list = hasBudget ? computeInsights(m, est) : [];
        if (list.length) {
          box.style.display = "";
          box.innerHTML =
            '<div class="np-ins-label"><span class="spark" aria-hidden="true"></span>Nova insights</div>' +
            list.map(function (i) {
              return '<div class="np-ins-row np-ins-' + i.tone + '"><span class="np-ins-dot" aria-hidden="true"></span><span>' + i.text + "</span></div>";
            }).join("");
        } else {
          box.style.display = "none";
          box.innerHTML = "";
        }
      }
    }

    // ── Render ────────────────────────────────────────────────────────
    var lastSig = "";
    var lastChannelIds = null;
    function initials(name) {
      if (!name) return "N";
      var parts = name.trim().split(/\s+/).filter(Boolean);
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }
    function escapeHtml(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }
    // Integer percentages that always sum to 100 (largest-remainder method)
    function pctRound(shares) {
      var raw = shares.map(function (s) { return s * 100; });
      var floor = raw.map(Math.floor);
      var rem = 100 - floor.reduce(function (a, b) { return a + b; }, 0);
      var order = raw.map(function (v, i) { return { i: i, frac: v - Math.floor(v) }; })
        .sort(function (a, b) { return b.frac - a.frac; });
      for (var k = 0; k < rem && k < order.length; k++) floor[order[k].i]++;
      return floor;
    }

    function render() {
      var card = $("npCard");
      if (!card) return;
      var m = gather();
      var hasBudget = m.total > 0;

      card.classList.toggle("is-empty", !hasBudget);
      // Gate the agent-strip: real budget AND actively recomputing (see
      // the .recomputing toggle below). Two real, already-computed
      // conditions — no separate/fake activity state.
      var previewPane = $("planPreview");
      if (previewPane) previewPane.classList.toggle("has-plan", hasBudget);

      // identity
      $("npLogo").textContent = initials(m.client);
      $("npClient").textContent = m.client || "Your client";
      var sub = $("npSubline");
      var pills = [];
      if (m.role) pills.push('<span class="np-pill">' + escapeHtml(m.role) + "</span>");
      if (m.locs.length) {
        var locTxt = m.locs[0] + (m.locs.length > 1 ? " +" + (m.locs.length - 1) : "");
        pills.push('<span class="np-pill">📍 ' + escapeHtml(locTxt) + "</span>");
      }
      if (!pills.length) pills.push('<span class="np-pill">Role &amp; targeting</span>');
      sub.innerHTML = pills.join("");

      // budget
      setNum($("npBudget"), m.total, hero);
      var foot = $("npBudgetFoot");
      if (hasBudget) {
        // Months to one decimal: "3-6 months" plans 4.5, not "~5".
        var periodWord = m.period === "campaign" ? "total campaign" :
          m.period === "monthly" ? ("over ~" + trim(m.months, 1) + " mo (" + hero(m.base) + "/mo)") :
          m.period === "quarterly" ? ("over ~" + trim(m.months, 1) + " mo (" + hero(m.base) + "/qtr)") :
          ("over ~" + trim(m.months, 1) + " mo (" + hero(m.base) + "/yr)");
        if (m.plan && m.plan.parse.is_range) {
          periodWord += " · midpoint of " + hero(m.plan.parse.low) + "–" + hero(m.plan.parse.high);
        }
        foot.innerHTML = "<b>" + (m.recommended ? "Recommended" : m.rows.length + "-channel") + "</b> mix · " + escapeHtml(periodWord);
      } else if (m.budgetError) {
        // The server's own message for this amount (it would reject it).
        foot.textContent = m.budgetError;
      } else {
        foot.textContent = "Set a budget to model your plan";
      }

      // mix note
      var note = $("npMixNote");
      var nCh = m.rows.length;
      note.textContent = m.recommended
        ? "· Nova recommended industry mix" + (nCh ? " (" + nCh + " channels)" : "")
        : "· " + nCh + " channel" + (nCh === 1 ? "" : "s") + " selected";

      // mix bar + legend. Rebuild only when the channel set changes;
      // otherwise update widths/amounts in place so the CSS transition
      // animates budget edits (rAF-free → screenshot-safe).
      var bar = $("npMixBar"), legend = $("npLegend");
      var pcts = pctRound(m.rows.map(function (r) { return r.share; }));
      var ids = m.rows.map(function (r) { return r.id; }).join(",");
      var inPlace = ids === lastChannelIds && bar.children.length === m.rows.length && legend.children.length === m.rows.length;
      if (!m.rows.length) {
        lastChannelIds = "";
        bar.innerHTML = "";
        legend.innerHTML = '<div class="np-leg-row np-leg-empty"><span class="np-leg-name">' +
          (m.recommended
            ? "Recommended industry mix appears once a budget and a role are set"
            : "No channels selected") + "</span></div>";
      } else if (inPlace) {
        m.rows.forEach(function (r, i) {
          bar.children[i].style.width = (r.share * 100).toFixed(1) + "%";
          var row = legend.children[i];
          row.querySelector(".np-leg-pct").textContent = pcts[i] + "%";
          row.querySelector(".np-leg-amt").textContent = hasBudget ? amtShort(r.spend) : "—";
        });
      } else {
        lastChannelIds = ids;
        bar.innerHTML = "";
        legend.innerHTML = "";
        m.rows.forEach(function (r, i) {
          var seg = document.createElement("div");
          seg.className = "np-mix-seg";
          seg.style.background = r.color;
          seg.style.width = (r.share * 100).toFixed(1) + "%"; // set directly — no rAF dependency
          bar.appendChild(seg);

          var row = document.createElement("div");
          row.className = "np-leg-row";
          row.innerHTML =
            '<span class="np-leg-dot" style="background:' + r.color + '"></span>' +
            '<span class="np-leg-name">' + escapeHtml(r.name) + "</span>" +
            '<span class="np-leg-pct">' + pcts[i] + "%</span>" +
            '<span class="np-leg-amt">' + (hasBudget ? amtShort(r.spend) : "—") + "</span>";
          legend.appendChild(row);
        });
      }

      // action card — let Nova apply its recommended mix to the real form
      var act = $("npAction");
      if (act) {
        if (hasBudget && m.recommended && fundedChannels && fundedChannels.length) {
          act.style.display = "";
          act.innerHTML =
            '<button type="button" class="np-apply-mix" onclick="NovaPreview.applyMix()">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>' +
            "Apply this mix to my plan</button>";
        } else {
          act.style.display = "none";
          act.innerHTML = "";
        }
      }

      // outcomes — single-sourced from /api/estimate, the SAME engine call
      // /api/generate makes. fetchEstimate() debounces the network call and
      // no-ops if budget/roles/locations haven't materially changed;
      // paintOutcomes() renders whatever the latest resolved state is
      // (placeholder while pending or on failure — never a local formula).
      fetchEstimate(m);
      // the plan currency follows the budget text AND the locations
      if (typeof novaRefreshPlanCurrency === "function") novaRefreshPlanCurrency();
      paintOutcomes(m);

      // pop on a real change (the "Updating estimate…" strip is NOT driven
      // from here: it follows the real request, see setEstimating)
      var sig = JSON.stringify([Math.round(m.total), m.rows.map(function (r) { return r.id; }).join(","), m.roleClass, m.targetHires]);
      if (sig !== lastSig) {
        lastSig = sig;
        card.classList.remove("pop"); void card.offsetWidth; card.classList.add("pop");
      }
      // "Plan ready" belongs to a GENERATED plan, and only for the inputs it
      // was generated from: any change to them takes the badge away again.
      var genPane = $("planPreview");
      if (genPane) {
        genPane.classList.toggle(
          "plan-generated",
          !!generatedSig && JSON.stringify(estimatePayload(m)) === generatedSig
        );
      }

      // Make Nova chat plan-aware: feed the live plan context into the widget
      // (the widget already forwards CONFIG._sessionContext to /api/chat).
      if (window.NovaChat && typeof window.NovaChat.setContext === "function") {
        var industry = val("naicsSearch");
        if (!industry) {
          var icard = document.querySelector(".industry-card.selected, .industry-card[aria-pressed='true']");
          if (icard) { var ih = icard.querySelector("h3, .industry-name, strong"); industry = ih ? ih.textContent.trim() : ""; }
        }
        try {
          window.NovaChat.setContext({
            source: "media-plan-studio",
            client: m.client || "",
            role: m.role || "",
            roles: readTags("rolesContainer"),
            locations: m.locs || [],
            industry: industry || "",
            budget: hasBudget ? hero(m.total) : "",
            budget_value: m.total || 0,
            channels: m.rows.map(function (r) { return r.name; }),
            // Single-sourced from the same /api/estimate result the preview
            // panel shows -- null (not a locally-computed guess) while a
            // fresh estimate is pending or unavailable.
            projected: (hasBudget && estimateFor(m)) ? {
              applications: Math.round(estimateFor(m).est_applications),
              hires: (estimateFor(m).projection && estimateFor(m).projection.assumptions && estimateFor(m).projection.assumptions.hires_suppressed) ? null : Math.round(estimateFor(m).est_hires),
              cost_per_application: Math.round(estimateFor(m).est_cpa * 100) / 100,
              // the ranges the panel shows (low-high), with what they assume
              ranges: estimateFor(m).projection ? estimateFor(m).projection.text : null,
            } : null,
          });
        } catch (e) { /* widget not ready */ }
      }
    }

    // ── Topbar step counter (mirrors the active wizard step) ───────────
    function updateStepNum() {
      var active = document.querySelector(".wizard-step.active");
      var el = $("stbStepNum");
      if (active && el) {
        var n = (active.id || "").replace(/\D/g, "");
        if (n) el.textContent = n;
      }
    }

    // ── Wiring ────────────────────────────────────────────────────────
    var pending = null;
    function schedule() {
      clearTimeout(pending);
      pending = setTimeout(function () { render(); updateStepNum(); }, 110);
    }
    // On the FIRST keystroke that changes the estimate's inputs, say so at
    // once: schedule() waits 110ms after the LAST keystroke, so a typed budget
    // used to sit beside the previous budget's figures ("$35K / 2,020 / 6 /
    // $17" under a field already reading 60000) for the whole typing burst.
    function markEdited() {
      try {
        var m = gather();
        if (JSON.stringify(estimatePayload(m)) !== lastScheduledSig) paintOutcomes(m);
      } catch (e) { /* the debounced render() repaints */ }
    }

    function boot() {
      // a11y: the toggle <label> wrappers have no text, so the checkboxes have
      // no accessible name. Give each one an aria-label (4.1.2 Name/Role/Value).
      var TOGGLE_NAMES = {
        chRegionalBoards: "Regional & local job boards",
        chGlobalBoards: "Global reach job boards",
        chNicheBoards: "Niche & industry-specific boards",
        chSocial: "Social media channels",
        chProgrammatic: "Programmatic & DSP channels",
        chEmployerBrand: "Employer branding platforms",
        chApac: "APAC regional channels",
        chEmea: "EMEA regional channels",
        includeEducational: "Educational partners & training programs",
        includeEvents: "Events & career fairs",
        includeRadioPodcasts: "Radio & podcasts",
        includeMediaPlatforms: "Media / print platforms",
        includeDEI: "DEI & diversity channels",
        includeInnovative: "Innovative channels 2025+",
        includeGlobalSupply: "Global supply strategy",
        includeBudgetGuide: "Budget & pricing guide",
      };
      Object.keys(TOGGLE_NAMES).forEach(function (id) {
        var el = document.getElementById(id);
        if (el && !el.getAttribute("aria-label")) el.setAttribute("aria-label", TOGGLE_NAMES[id]);
      });

      if (!$("npCard")) return;
      var estimateBar = $("npEstimateBar");
      if (estimateBar) estimateBar.addEventListener("click", showPane);
      render();
      updateStepNum();
      document.addEventListener("input", function () { markEdited(); schedule(); }, true);
      document.addEventListener("change", function (e) {
        if (e.target && e.target.id && CHANNELS[e.target.id]) markChannelsTouched();
        schedule();
      }, true);
      document.addEventListener("click", function (e) {
        if (e.target.closest(".preset-chip, .toggle-switch, .industry-card, .tag, .job-cat-card")) {
          setTimeout(schedule, 60);
        }
      }, true);
      // Catch programmatic changes (preset fills, tag additions, step switches)
      var host = document.querySelector("main.container");
      if (host && window.MutationObserver) {
        new MutationObserver(function () { schedule(); })
          .observe(host, { subtree: true, childList: true, attributes: true, attributeFilter: ["class", "value"] });
      }
      // Safety poll for anything missed
      setInterval(function () { render(); updateStepNum(); }, 1600);
    }

    // Apply the recommended mix the engine funded to the real toggles:
    // exactly those channels on, every other channel off.
    function applyMix() {
      if (!fundedChannels || !fundedChannels.length) return;
      var on = {};
      fundedChannels.forEach(function (f) { on[f.id] = true; });
      markChannelsTouched();
      ORDER.forEach(function (id) {
        var el = $(id);
        if (el && el.checked !== !!on[id]) {
          el.checked = !!on[id];
          el.dispatchEvent(new Event("change", { bubbles: true }));
        }
      });
      render();
    }

    // The funded channel ids for the review step (body_app_js.html), or
    // null while no estimate for the current inputs has arrived.
    function funded() {
      return fundedChannels ? fundedChannels.map(function (f) { return f.id; }) : null;
    }

    window.NovaPreview = {
      update: render, finalize: finalize, applyMix: applyMix, fundedChannels: funded,
      markGenerated: markGenerated, showPane: showPane, feasibility: feasibility,
      planIsCurrent: planIsCurrent,
    };
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  })();
</script>
