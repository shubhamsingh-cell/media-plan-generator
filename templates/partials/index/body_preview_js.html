<!-- ════════════════════════════════════════════════════════════════════
     NOVA PLAN STUDIO — live media-plan preview engine
     Reads the wizard fields and renders a brand-true plan that updates in
     real time (budget → channel mix → projected applies / hires / CPA).
     Self-contained; only reads the DOM, never mutates form fields.
     ════════════════════════════════════════════════════════════════════ -->
<script>
  (function () {
    "use strict";

    // True once the user toggles any channel in Step 3.
    var channelsTouched = false;

    // ── Channel model (recruitment-marketing benchmarks) ──────────────
    // w = allocation weight · cpa = baseline cost per application (mid-skill)
    var CHANNELS = {
      chProgrammatic: { name: "Programmatic & DSP", color: "#6bb5ce", w: 1.35, cpa: 22 },
      chGlobalBoards: { name: "Global reach boards", color: "#5a54be", w: 1.25, cpa: 30 },
      chNicheBoards:  { name: "Niche & industry", color: "#b7669e", w: 0.9, cpa: 48 },
      chSocial:       { name: "Social media", color: "#8680d6", w: 1.0, cpa: 38 },
      chRegionalBoards: { name: "Regional & local", color: "#3e8fab", w: 0.85, cpa: 26 },
      chEmployerBrand: { name: "Employer branding", color: "#202058", w: 0.6, cpa: 85 },
      chApac:         { name: "APAC regional", color: "#45b6c8", w: 0.8, cpa: 16 },
      chEmea:         { name: "EMEA regional", color: "#3e8fab", w: 0.8, cpa: 24 },
    };
    // Order in which channels appear in the mix bar / legend
    var ORDER = ["chProgrammatic", "chGlobalBoards", "chNicheBoards", "chSocial",
      "chRegionalBoards", "chEmployerBrand", "chApac", "chEmea"];
    // Sensible default mix shown before the user picks channels
    var STARTER = ["chProgrammatic", "chGlobalBoards", "chSocial", "chNicheBoards"];

    var BUDGET_MIDPOINTS = {
      "< $50,000": 35000,
      "$50,000 - $250,000": 150000,
      "$250,000 - $500,000": 375000,
      "$500,000 - $1,000,000": 750000,
      "$1,000,000 - $3,000,000": 2000000,
      "$3,000,000+": 4000000,
    };
    var DURATION_MONTHS = {
      "1-3 months": 2, "3-6 months": 4.5, "6-12 months": 9,
      "1-2 years": 18, "2-5 years (Long-term)": 42, "Ongoing": 12,
    };

    // ── Small helpers ─────────────────────────────────────────────────
    function $(id) { return document.getElementById(id); }
    function val(id) { var el = $(id); return el ? (el.value || "").trim() : ""; }

    function parseMoney(s) {
      if (!s) return 0;
      s = String(s).trim().toLowerCase().replace(/[$,\s]/g, "");
      var m = s.match(/^([0-9]*\.?[0-9]+)\s*([kmb])?/);
      if (!m) return 0;
      var n = parseFloat(m[1]);
      if (!isFinite(n)) return 0;
      var suf = m[2];
      if (suf === "k") n *= 1e3;
      else if (suf === "m") n *= 1e6;
      else if (suf === "b") n *= 1e9;
      return n;
    }

    function readTags(containerId) {
      var c = $(containerId);
      if (!c) return [];
      var out = [];
      c.querySelectorAll(".tag").forEach(function (t) {
        var txt = (t.textContent || "").replace(/[×✕✖]/g, "").trim();
        if (txt) out.push(txt);
      });
      return out;
    }

    function checkedValues(name) {
      var out = [];
      document.querySelectorAll('input[name="' + name + '"]:checked').forEach(function (c) {
        out.push(c.value);
      });
      return out;
    }

    // ── Money formatters ──────────────────────────────────────────────
    function trim(x, d) { return Number(x.toFixed(d)).toString(); }
    function hero(v) {
      v = Math.max(0, v);
      if (v >= 1e6) return "$" + trim(v / 1e6, 2) + "M";
      if (v >= 1e3) return "$" + Math.round(v / 1e3) + "K";
      return "$" + Math.round(v);
    }
    function amtShort(v) {
      v = Math.max(0, v);
      if (v >= 1e6) return "$" + trim(v / 1e6, 1) + "M";
      if (v >= 1e3) return "$" + Math.round(v / 1e3) + "K";
      return "$" + Math.round(v);
    }
    function intc(v) { return Math.round(Math.max(0, v)).toLocaleString(); }
    function cpaFmt(v) { return v > 0 ? "$" + v.toFixed(2) : "—"; }

    // ── Screenshot-safe count-up ──────────────────────────────────────
    var COUNTERS = new Set();
    function setNum(el, value, fmt) {
      if (!el) return;
      COUNTERS.add(el);
      el.__target = value;
      el.__fmt = fmt;
      var reduce = (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) || document.hidden;
      var start = (typeof el.__cur === "number") ? el.__cur : 0;
      if (reduce || start === value || !isFinite(value)) {
        el.__cur = value; el.textContent = fmt(value); return;
      }
      var t0 = performance.now(), dur = 600;
      cancelAnimationFrame(el.__raf);
      function tick(now) {
        var p = Math.min(1, (now - t0) / dur);
        var eased = 1 - Math.pow(1 - p, 3);
        var cur = start + (value - start) * eased;
        el.textContent = fmt(cur);
        if (p < 1) el.__raf = requestAnimationFrame(tick);
        else { el.__cur = value; el.textContent = fmt(value); }
      }
      el.__raf = requestAnimationFrame(tick);
      clearTimeout(el.__snap);
      el.__snap = setTimeout(function () {
        el.__cur = value; el.textContent = fmt(value); cancelAnimationFrame(el.__raf);
      }, dur + 250);
    }
    function finalize() {
      COUNTERS.forEach(function (el) {
        if (typeof el.__target === "number" && el.__fmt) {
          cancelAnimationFrame(el.__raf); el.__cur = el.__target; el.textContent = el.__fmt(el.__target);
        }
      });
      // Force-commit mix-bar widths with transition off (compositor may be
      // paused in a backgrounded tab, freezing the width transition at 0).
      var bar = $("npMixBar");
      if (bar) {
        bar.querySelectorAll(".np-mix-seg").forEach(function (seg) {
          var w = seg.style.width;
          seg.style.transition = "none";
          seg.style.width = w;
          void seg.offsetWidth;
          seg.style.transition = "";
        });
      }
    }

    // ── Gather model from the form ────────────────────────────────────
    function gather() {
      // budget — exact-first: prefer the typed amount, fall back to bucket
      var br = val("budgetRange");
      var base = parseMoney(val("exactBudget"));
      if (!base) base = BUDGET_MIDPOINTS[br] || 0;

      var months = DURATION_MONTHS[val("campaignDuration")] || 6;
      var period = val("budgetPeriod") || "campaign";
      var total = base;
      if (period === "monthly") total = base * months;
      else if (period === "quarterly") total = base * (months / 3);
      else if (period === "annual") total = base * (months / 12);

      // channels — show Nova's recommended mix until the user engages
      // the channel toggles (the markup pre-checks only Social by default).
      var selected = ORDER.filter(function (id) { var el = $(id); return el && el.checked; });
      var usingStarter = !channelsTouched || selected.length === 0;
      var active = usingStarter ? STARTER.slice() : selected;

      // role class, used downstream (BENCH lookup, insight copy). Explicit
      // experience-level checkboxes win; otherwise infer from role text.
      // NOTE: this used to also derive a flat cpaMult/aph cost-per-hire
      // multiplier for the naive JS estimator removed alongside
      // /api/estimate (see fetchEstimate() below) -- those locals are gone,
      // only the role classification itself is still needed.
      var exp = checkedValues("experienceLevel").join(" ").toLowerCase();
      var roleStr = (readTags("rolesContainer").join(" ") + " " + val("roleInput") + " " + val("useCase")).toLowerCase();
      var roleClass = "skilled"; // mid-skill professional default
      if (exp.indexOf("executive") >= 0 || /\b(vp|chief|cxo|c-level|head of|director|executive|president)\b/.test(roleStr)) {
        roleClass = "executive";
      } else if (exp.indexOf("entry") >= 0 || /\b(warehouse|associate|driver|cashier|retail|crew|server|picker|packer|delivery|labor|cleaner|housekeep|caregiver|cna)\b/.test(roleStr)) {
        roleClass = "highVolume";
      } else if (exp.indexOf("senior") >= 0 || /\b(senior|lead|principal|staff)\b/.test(roleStr)) {
        roleClass = "senior";
      } else if (/\b(software|engineer|developer|devops|sre|architect|data scientist|machine learning|\bml\b|cyber|security engineer)\b/.test(roleStr)) {
        roleClass = "tech";
      }

      // target hire volume the user set (vs what the budget projects)
      var hvSel = val("hireVolume");
      var targetHires = 0;
      if (hvSel === "__exact__") {
        targetHires = parseInt((val("exactHires") || "").replace(/[^0-9]/g, ""), 10) || 0;
      } else {
        var HV = { "1-10 hires": 6, "10-50 hires": 30, "50-100 hires": 75, "100-500 hires": 250, "500+ hires": 600 };
        targetHires = HV[hvSel] || 0;
      }
      var startMonth = parseInt(val("campaignStartMonth"), 10) || 0;

      // metro premium
      var locs = readTags("locationsContainer");
      var locStr = locs.join(" ").toLowerCase();
      var metroMult = /(san francisco|bay area|new york|nyc|london|seattle|boston)/.test(locStr) ? 1.12 : 1.0;

      // allocation by weight -- spend split across the mix bar / legend.
      // NOTE: applications/hires/CPA are deliberately NOT derived here.
      // They used to come from a flat effective-CPA-per-channel formula
      // that diverged from the real budget engine by ~13x on real briefs
      // (617 naively-estimated hires vs. 48 actual engine-projected hires
      // on the Manpower-AmeriGas brief). Those numbers now come from
      // /api/estimate, which calls the SAME calculate_budget_allocation()
      // /api/generate uses -- see fetchEstimate() / paintOutcomes() below.
      var wsum = 0;
      active.forEach(function (id) { wsum += CHANNELS[id].w; });
      var rows = active.map(function (id) {
        var c = CHANNELS[id];
        var share = wsum > 0 ? c.w / wsum : 0;
        var spend = total * share;
        return { id: id, name: c.name, color: c.color, share: share, spend: spend };
      });

      // identity bits
      var client = val("clientName");
      var role = readTags("rolesContainer")[0] || "";
      if (!role) {
        var sel = document.querySelector(".industry-card.selected, .industry-card[aria-pressed='true']");
        if (sel) { var h = sel.querySelector("h3, .industry-name, strong"); role = h ? h.textContent.trim() : ""; }
      }
      if (!role) role = val("naicsSearch");

      return {
        total: total, rows: rows, usingStarter: usingStarter,
        client: client, role: role, locs: locs, period: period, months: months,
        roleClass: roleClass, targetHires: targetHires, startMonth: startMonth,
        metro: metroMult > 1, channelsTouched: channelsTouched,
      };
    }

    // ── Live plan estimate (single-sourced via /api/estimate) ─────────
    // Root-cause fix: the "Projected outcomes" numbers used to come from
    // the flat effective-CPA formula above. This now calls the real
    // engine (same calculate_budget_allocation() /api/generate uses) so
    // the preview and the final generated plan can never disagree.
    var ESTIMATE_DEBOUNCE_MS = 500;
    var estimateTimer = null;
    var lastScheduledSig = "";   // signature of the last request scheduled/sent
    var latestEstimate = null;   // {est_hires, est_cph, est_applications, est_cpa} | null
    // Finding D (2026-07-15 review): a failed/errored fetch used to leave
    // lastScheduledSig set to the failed sig forever, so fetchEstimate()'s
    // own dedupe guard (`sig === lastScheduledSig`) silently no-opped every
    // later render() tick -- including the 1600ms safety poll -- until the
    // user edited an input. estimateRetrySig/-Count track consecutive
    // failures for the CURRENT sig so a down/erroring server gets a bounded
    // number of automatic retries instead of either hammering forever or
    // going permanently silent.
    var ESTIMATE_MAX_AUTO_RETRIES = 3;
    var estimateRetrySig = "";   // sig currently being auto-retried
    var estimateRetryCount = 0;  // consecutive failures for estimateRetrySig

    function resolveIndustry() {
      var industry = "";
      var icard = document.querySelector(".industry-card.selected, .industry-card[aria-pressed='true']");
      if (icard) industry = icard.dataset.industry || "";
      if (!industry) industry = val("naicsSearch");
      return industry;
    }

    function estimatePayload(m, roles, industry, clientName) {
      return {
        budget: String(Math.round(m.total)),
        industry: industry,
        client_name: clientName,
        roles: roles,
        locations: m.locs,
      };
    }

    // Fetches a fresh /api/estimate only when the inputs that actually
    // feed calculate_budget_allocation (budget, roles, locations, industry,
    // client_name) have changed -- not on every mix-bar-only or copy-only
    // render() tick. industry/client_name are resolved once here and
    // threaded through to estimatePayload() below so the signature always
    // matches exactly what gets sent -- they used to be missing from this
    // signature entirely, so switching industry (which materially changes
    // the engine's channel mix and result) with an unchanged budget/roles/
    // locations silently kept showing the PREVIOUS industry's stale
    // estimate.
    function fetchEstimate(m) {
      var roles = readTags("rolesContainer");
      var industry = resolveIndustry();
      var clientName = val("clientName");
      var sig = JSON.stringify([
        Math.round(m.total), (m.locs || []).slice().sort(), roles.slice().sort(),
        industry, clientName
      ]);
      if (sig === lastScheduledSig) return;
      if (sig !== estimateRetrySig) {
        // A genuinely new input state, not just fetchEstimate() re-running
        // for the SAME failed sig after the catch handler below cleared
        // lastScheduledSig to retry it -- reset its retry budget.
        estimateRetrySig = sig;
        estimateRetryCount = 0;
      }
      lastScheduledSig = sig;
      clearTimeout(estimateTimer);

      if (!m.total || m.total <= 0 || !roles.length) {
        latestEstimate = null;
        paintOutcomes(m);
        return;
      }

      // Never show a stale/naive number while a new estimate is pending --
      // clear to the neutral placeholder immediately, fill in once real.
      latestEstimate = null;
      paintOutcomes(m);

      estimateTimer = setTimeout(function () {
        var requestSig = sig;
        var payload = estimatePayload(m, roles, industry, clientName);
        fetch("/api/estimate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRF-Token": (typeof getCsrfToken === "function" ? getCsrfToken() : ""),
          },
          body: JSON.stringify(payload),
        }).then(function (res) {
          if (!res.ok) throw new Error("estimate failed: " + res.status);
          return res.json();
        }).then(function (data) {
          if (requestSig !== lastScheduledSig) return; // superseded by a newer request
          latestEstimate = (data && typeof data.est_hires === "number") ? data : null;
          estimateRetryCount = 0; // a response (even a malformed one) ends the failure streak
          // Repaint from a FRESH gather(), not the `m` snapshot captured when
          // this fetch was scheduled -- targetHires/roleClass/channels can
          // have changed while the request was in flight (the sig guard
          // above only covers budget/roles/locations/industry/clientName),
          // and computeInsights()/NovaChat.projected must reflect the
          // wizard's CURRENT state, not a stale one.
          paintOutcomes(gather());
        }).catch(function () {
          if (requestSig !== lastScheduledSig) return;
          latestEstimate = null;
          paintOutcomes(gather());
          // Auto-retry via the next render() tick (input-driven or the
          // 1600ms safety poll): clearing lastScheduledSig makes this same
          // sig look "new" again to fetchEstimate()'s dedupe guard above,
          // instead of silently never refetching until an input changes.
          // Capped so a genuinely-down server isn't hammered forever once
          // inputs stop changing.
          if (requestSig === estimateRetrySig && estimateRetryCount < ESTIMATE_MAX_AUTO_RETRIES) {
            estimateRetryCount++;
            lastScheduledSig = "";
          }
        });
      }, ESTIMATE_DEBOUNCE_MS);
    }

    // ── Insight engine: turn the model into proactive advice ──────────
    // `est` is the latest /api/estimate response (or null while pending /
    // on failure) -- insights #1 and #2 make numeric hire/cost claims, so
    // they only render once `est` is a real, engine-derived number. Never
    // fall back to a locally-computed hire/CPH figure here.
    function channelOn(id) { var el = $(id); return !!(el && el.checked); }
    function computeInsights(m, est) {
      var ins = [];
      var role = escapeHtml(m.role || ""); // user-controlled — escape before HTML
      // 1. feasibility vs the user's hire target (targetHires is collected
      // straight from the wizard's hireVolume/exactHires fields -- unchanged).
      // Honesty rule: "comfortably covers" (or any positive tone) is only
      // ever shown when the engine's est_hires actually meets the target.
      if (est && m.targetHires > 0 && est.est_hires > 0) {
        var ratio = est.est_hires / m.targetHires;
        if (ratio < 1.0) {
          var gap = m.total * (m.targetHires / est.est_hires - 1);
          ins.push({ tone: "warn", text: "Budget supports <b>~" + intc(est.est_hires) + " hires</b> against your " + intc(m.targetHires) + "-hire target — consider raising budget by ~<b>" + hero(gap) + "</b> or narrowing scope." });
        } else if (ratio > 1.35) {
          ins.push({ tone: "good", text: "Budget comfortably covers your <b>" + intc(m.targetHires) + "-hire</b> target (~" + intc(est.est_hires) + " projected)." });
        } else {
          ins.push({ tone: "good", text: "On track — budget supports <b>~" + intc(est.est_hires) + " hires</b> for your " + intc(m.targetHires) + " target." });
        }
      }
      // 2. cost per hire vs a role-class benchmark
      var BENCH = { executive: 14000, senior: 6500, tech: 5000, skilled: 3500, highVolume: 450 };
      var bench = BENCH[m.roleClass] || 3500;
      if (est && est.est_cph > 0) {
        var cph = est.est_cph;
        if (cph > bench * 1.4) {
          ins.push({ tone: "warn", text: "High <b>~" + hero(cph) + "/hire</b> for " + (role || "this role") + ". Niche boards + employer brand usually pull it down." });
        } else if (cph < bench * 0.7) {
          ins.push({ tone: "good", text: "Efficient <b>~" + hero(cph) + "/hire</b> — strong for " + (role || "this role") + "." });
        }
      }
      // 3. channel fit
      if (!m.usingStarter && m.rows.length === 1) {
        ins.push({ tone: "info", text: "Single channel — diversifying lowers risk and blended CPA." });
      } else if ((m.roleClass === "senior" || m.roleClass === "executive" || m.roleClass === "tech") && m.channelsTouched && !channelOn("chNicheBoards") && !channelOn("chEmployerBrand")) {
        ins.push({ tone: "info", text: "For " + (role || "senior roles") + ", add <b>Niche</b> or <b>Employer-brand</b> channels to reach passive talent." });
      }
      // 4. seasonality
      if (m.startMonth) {
        var q = Math.ceil(m.startMonth / 3);
        if (q === 1) ins.push({ tone: "info", text: "Q1 start = <b>peak hiring</b> — expect ~15% higher CPCs; front-load budget." });
        else if (q === 4) ins.push({ tone: "info", text: "Q4 start — holiday slowdown; demand softens, costs ease late-quarter." });
      }
      return ins.slice(0, 3);
    }

    // Paints #npApplies/#npHires/#npCpa and #npInsights from whatever the
    // current resolved estimate state is (latestEstimate, module-level).
    // Never reads a local hire/CPA formula -- placeholder ("—") while
    // `latestEstimate` is null (pending fetch, failure, or no budget yet).
    function paintOutcomes(m) {
      var hasBudget = m.total > 0;
      if (hasBudget && latestEstimate) {
        setNum($("npApplies"), latestEstimate.est_applications, intc);
        setNum($("npHires"), latestEstimate.est_hires, intc);
        setNum($("npCpa"), latestEstimate.est_cpa, cpaFmt);
      } else {
        ["npApplies", "npHires", "npCpa"].forEach(function (id) {
          var el = $(id); if (el) { el.textContent = "—"; el.__cur = 0; }
        });
      }

      // Nova insights — proactive advice from the model
      var box = $("npInsights");
      if (box) {
        var list = hasBudget ? computeInsights(m, latestEstimate) : [];
        if (list.length) {
          box.style.display = "";
          box.innerHTML =
            '<div class="np-ins-label"><span class="spark" aria-hidden="true"></span>Nova insights</div>' +
            list.map(function (i) {
              return '<div class="np-ins-row np-ins-' + i.tone + '"><span class="np-ins-dot" aria-hidden="true"></span><span>' + i.text + "</span></div>";
            }).join("");
        } else {
          box.style.display = "none";
          box.innerHTML = "";
        }
      }
    }

    // ── Render ────────────────────────────────────────────────────────
    var lastSig = "";
    var lastChannelIds = null;
    function initials(name) {
      if (!name) return "N";
      var parts = name.trim().split(/\s+/).filter(Boolean);
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }
    function escapeHtml(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }
    // Integer percentages that always sum to 100 (largest-remainder method)
    function pctRound(shares) {
      var raw = shares.map(function (s) { return s * 100; });
      var floor = raw.map(Math.floor);
      var rem = 100 - floor.reduce(function (a, b) { return a + b; }, 0);
      var order = raw.map(function (v, i) { return { i: i, frac: v - Math.floor(v) }; })
        .sort(function (a, b) { return b.frac - a.frac; });
      for (var k = 0; k < rem && k < order.length; k++) floor[order[k].i]++;
      return floor;
    }

    function render() {
      var card = $("npCard");
      if (!card) return;
      var m = gather();
      var hasBudget = m.total > 0;

      card.classList.toggle("is-empty", !hasBudget);
      // Gate the agent-strip: real budget AND actively recomputing (see
      // the .recomputing toggle below). Two real, already-computed
      // conditions — no separate/fake activity state.
      var previewPane = $("planPreview");
      if (previewPane) previewPane.classList.toggle("has-plan", hasBudget);

      // identity
      $("npLogo").textContent = initials(m.client);
      $("npClient").textContent = m.client || "Your client";
      var sub = $("npSubline");
      var pills = [];
      if (m.role) pills.push('<span class="np-pill">' + escapeHtml(m.role) + "</span>");
      if (m.locs.length) {
        var locTxt = m.locs[0] + (m.locs.length > 1 ? " +" + (m.locs.length - 1) : "");
        pills.push('<span class="np-pill">📍 ' + escapeHtml(locTxt) + "</span>");
      }
      if (!pills.length) pills.push('<span class="np-pill">Role &amp; targeting</span>');
      sub.innerHTML = pills.join("");

      // budget
      setNum($("npBudget"), m.total, hero);
      var foot = $("npBudgetFoot");
      if (hasBudget) {
        var periodWord = m.period === "campaign" ? "total campaign" :
          m.period === "monthly" ? ("over ~" + trim(m.months, 0) + " mo (" + hero(m.total / m.months) + "/mo)") :
          m.period === "quarterly" ? "across the campaign" : "annualized";
        foot.innerHTML = "<b>" + (m.usingStarter ? "Recommended" : m.rows.length + "-channel") + "</b> mix · " + periodWord;
      } else {
        foot.textContent = "Set a budget to model your plan";
      }

      // mix note
      var note = $("npMixNote");
      var nCh = m.rows.length;
      note.textContent = m.usingStarter
        ? "· Nova recommended starter mix"
        : "· " + nCh + " channel" + (nCh === 1 ? "" : "s") + " selected";

      // agent-strip line 2 — reflect the real channel count being modeled
      var agentCh = $("npAgentChannels");
      if (agentCh) {
        agentCh.textContent = m.usingStarter
          ? "Matching Nova's recommended mix"
          : "Matching " + nCh + " channel" + (nCh === 1 ? "" : "s");
      }

      // mix bar + legend. Rebuild only when the channel set changes;
      // otherwise update widths/amounts in place so the CSS transition
      // animates budget edits (rAF-free → screenshot-safe).
      var bar = $("npMixBar"), legend = $("npLegend");
      var pcts = pctRound(m.rows.map(function (r) { return r.share; }));
      var ids = m.rows.map(function (r) { return r.id; }).join(",");
      var inPlace = ids === lastChannelIds && bar.children.length === m.rows.length && legend.children.length === m.rows.length;
      if (inPlace) {
        m.rows.forEach(function (r, i) {
          bar.children[i].style.width = (r.share * 100).toFixed(1) + "%";
          var row = legend.children[i];
          row.querySelector(".np-leg-pct").textContent = pcts[i] + "%";
          row.querySelector(".np-leg-amt").textContent = hasBudget ? amtShort(r.spend) : "—";
        });
      } else {
        lastChannelIds = ids;
        bar.innerHTML = "";
        legend.innerHTML = "";
        m.rows.forEach(function (r, i) {
          var seg = document.createElement("div");
          seg.className = "np-mix-seg";
          seg.style.background = r.color;
          seg.style.width = (r.share * 100).toFixed(1) + "%"; // set directly — no rAF dependency
          bar.appendChild(seg);

          var row = document.createElement("div");
          row.className = "np-leg-row";
          row.innerHTML =
            '<span class="np-leg-dot" style="background:' + r.color + '"></span>' +
            '<span class="np-leg-name">' + escapeHtml(r.name) + "</span>" +
            '<span class="np-leg-pct">' + pcts[i] + "%</span>" +
            '<span class="np-leg-amt">' + (hasBudget ? amtShort(r.spend) : "—") + "</span>";
          legend.appendChild(row);
        });
      }

      // action card — let Nova apply its recommended mix to the real form
      var act = $("npAction");
      if (act) {
        if (hasBudget && m.usingStarter) {
          act.style.display = "";
          act.innerHTML =
            '<button type="button" class="np-apply-mix" onclick="NovaPreview.applyMix()">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>' +
            "Apply this mix to my plan</button>";
        } else {
          act.style.display = "none";
          act.innerHTML = "";
        }
      }

      // outcomes — single-sourced from /api/estimate, the SAME engine call
      // /api/generate makes. fetchEstimate() debounces the network call and
      // no-ops if budget/roles/locations haven't materially changed;
      // paintOutcomes() renders whatever the latest resolved state is
      // (placeholder while pending or on failure — never a local formula).
      fetchEstimate(m);
      paintOutcomes(m);

      // pop + recompute shimmer on real change
      var sig = JSON.stringify([Math.round(m.total), m.rows.map(function (r) { return r.id; }).join(","), m.roleClass, m.targetHires]);
      if (sig !== lastSig) {
        lastSig = sig;
        card.classList.remove("pop"); void card.offsetWidth; card.classList.add("pop");
        var pane = $("planPreview");
        if (pane) {
          pane.classList.add("recomputing");
          clearTimeout(pane.__rc);
          pane.__rc = setTimeout(function () { pane.classList.remove("recomputing"); }, 650);
        }
      }

      // Make Nova chat plan-aware: feed the live plan context into the widget
      // (the widget already forwards CONFIG._sessionContext to /api/chat).
      if (window.NovaChat && typeof window.NovaChat.setContext === "function") {
        var industry = val("naicsSearch");
        if (!industry) {
          var icard = document.querySelector(".industry-card.selected, .industry-card[aria-pressed='true']");
          if (icard) { var ih = icard.querySelector("h3, .industry-name, strong"); industry = ih ? ih.textContent.trim() : ""; }
        }
        try {
          window.NovaChat.setContext({
            source: "media-plan-studio",
            client: m.client || "",
            role: m.role || "",
            roles: readTags("rolesContainer"),
            locations: m.locs || [],
            industry: industry || "",
            budget: hasBudget ? hero(m.total) : "",
            budget_value: m.total || 0,
            channels: m.rows.map(function (r) { return r.name; }),
            // Single-sourced from the same /api/estimate result the preview
            // panel shows -- null (not a locally-computed guess) while a
            // fresh estimate is pending or unavailable.
            projected: (hasBudget && latestEstimate) ? {
              applications: Math.round(latestEstimate.est_applications),
              hires: Math.round(latestEstimate.est_hires),
              cost_per_application: Math.round(latestEstimate.est_cpa * 100) / 100,
            } : null,
          });
        } catch (e) { /* widget not ready */ }
      }
    }

    // ── Topbar step counter (mirrors the active wizard step) ───────────
    function updateStepNum() {
      var active = document.querySelector(".wizard-step.active");
      var el = $("stbStepNum");
      if (active && el) {
        var n = (active.id || "").replace(/\D/g, "");
        if (n) el.textContent = n;
      }
    }

    // ── Wiring ────────────────────────────────────────────────────────
    var pending = null;
    function schedule() {
      clearTimeout(pending);
      pending = setTimeout(function () { render(); updateStepNum(); }, 110);
    }

    function boot() {
      // a11y: the toggle <label> wrappers have no text, so the checkboxes have
      // no accessible name. Give each one an aria-label (4.1.2 Name/Role/Value).
      var TOGGLE_NAMES = {
        chRegionalBoards: "Regional & local job boards",
        chGlobalBoards: "Global reach job boards",
        chNicheBoards: "Niche & industry-specific boards",
        chSocial: "Social media channels",
        chProgrammatic: "Programmatic & DSP channels",
        chEmployerBrand: "Employer branding platforms",
        chApac: "APAC regional channels",
        chEmea: "EMEA regional channels",
        includeEducational: "Educational partners & training programs",
        includeEvents: "Events & career fairs",
        includeRadioPodcasts: "Radio & podcasts",
        includeMediaPlatforms: "Media / print platforms",
        includeDEI: "DEI & diversity channels",
        includeInnovative: "Innovative channels 2025+",
        includeGlobalSupply: "Global supply strategy",
        includeBudgetGuide: "Budget & pricing guide",
      };
      Object.keys(TOGGLE_NAMES).forEach(function (id) {
        var el = document.getElementById(id);
        if (el && !el.getAttribute("aria-label")) el.setAttribute("aria-label", TOGGLE_NAMES[id]);
      });

      if (!$("npCard")) return;
      render();
      updateStepNum();
      document.addEventListener("input", schedule, true);
      document.addEventListener("change", function (e) {
        if (e.target && e.target.id && CHANNELS[e.target.id]) channelsTouched = true;
        schedule();
      }, true);
      document.addEventListener("click", function (e) {
        if (e.target.closest(".preset-chip, .toggle-switch, .industry-card, .tag, .job-cat-card")) {
          setTimeout(schedule, 60);
        }
      }, true);
      // Catch programmatic changes (preset fills, tag additions, step switches)
      var host = document.querySelector("main.container");
      if (host && window.MutationObserver) {
        new MutationObserver(function () { schedule(); })
          .observe(host, { subtree: true, childList: true, attributes: true, attributeFilter: ["class", "value"] });
      }
      // Safety poll for anything missed
      setInterval(function () { render(); updateStepNum(); }, 1600);
    }

    // Apply Nova's recommended starter mix to the real channel toggles.
    function applyMix() {
      channelsTouched = true;
      STARTER.forEach(function (id) {
        var el = $(id);
        if (el && !el.checked) {
          el.checked = true;
          el.dispatchEvent(new Event("change", { bubbles: true }));
        }
      });
      render();
    }

    window.NovaPreview = { update: render, finalize: finalize, applyMix: applyMix };
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  })();
</script>
